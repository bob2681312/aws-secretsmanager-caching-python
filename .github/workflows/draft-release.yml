# This workflow will install Python dependencies, run tests and lint with a variety of Python versions.
# After doing that, it will draft a release with the most up to date version

name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (must be in format <MAJOR>.<MINOR>.<PATCH>, e.g. 1.1.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Verify input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          SEMVER_REGEX="^([0-9]+)\.([0-9]+)\.([0-9]+)$"
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::Invalid version format '$VERSION'. Must match X.Y.Z (e.g., 1.0.4)"
            exit 1
          fi
  test:
    uses: ./.github/workflows/python-package.yml

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft release v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"

          echo "Drafted release v$VERSION"
          gh release view "v$VERSION" --json url -q .url
      