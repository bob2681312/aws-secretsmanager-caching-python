# This workflow will install Python dependencies, run tests and lint with a variety of Python versions.
# After doing that, it will draft a release with the most up to date version

name: Create New Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (must be in format <MAJOR>.<MINOR>.<PATCH>, e.g. 1.1.1)'
        required: true
        type: string

jobs:
  verify-input:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Make sure the input matches the intended format
          SEMVER_REGEX="^([0-9]+)\.([0-9]+)\.([0-9]+)$"
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::Invalid version format '$VERSION'. Must match X.Y.Z (e.g., 1.0.4)"
            exit 1
          fi

          TAG="v$VERSION"

          # Fail if the tag already exists
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Error: Tag $TAG already exists. Aborting."
            exit 1
          fi

          echo "Creating Tag $TAG ..."

  run-test:
    permissions:
      contents: read
      id-token: write
    needs: verify-input
    # Calls the Pull Request workflow and ensure all tests pass before moving on
    uses: ./.github/workflows/python-package.yml

  draft-release:
    runs-on: ubuntu-latest
    needs: run-test
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Draft release v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"

          echo "Drafted release v$VERSION"
  
  release-test-information-PLEASE-READ:
    runs-on: ubuntu-latest
    needs: draft-release
    steps:
      - name: Review Instructuons (PLEASE READ)
        run: |
          echo "Please do the following before approving release for prod."
          echo "Go to https://test.pypi.org/project/aws-secretsmanager-caching/"
          echo "Check the page for completeness. There should be a new version published, and two artifacts in the "Download files" section: a wheel (.whl) and a source distribution (.tar.gz)"

  release-test:
    runs-on: ubuntu-latest
    needs: release-test-information-PLEASE-READ
    # Guard against the poll loop below burning runner minutes if a build hangs
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: release-prod
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100
        with:
          role-to-assume: ${{ secrets.RELEASE_ROLE_ARN }}
          aws-region: us-west-2
          role-duration-seconds: 3600

      - name: Start test release build
        id: start
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name "python-caching-library-PyPi-release-Test" \
            --source-version "$GITHUB_SHA" \
            --query 'build.id' --output text)

          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for test release build
        env:
          BUILD_ID: ${{ steps.start.outputs.build-id }}
        run: |
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' --output text)

            case "$STATUS" in
              IN_PROGRESS)
                echo "Build has not finished, sleep for 30 more seconds"
                sleep 30
                ;;
              SUCCEEDED)
                echo "Build succeeded!"
                exit 0
                ;;
              *)
                echo "::error::Build finished with status $STATUS."
                exit 1
                ;;
            esac
          done
  
  release-prod-information-PLEASE-READ:
    runs-on: ubuntu-latest
    needs: release-test
    steps:
      - name: Review Instructuons (PLEASE READ)
        run: |
          echo "Please do the following before approving release for prod."
          echo "Go to https://test.pypi.org/project/aws-secretsmanager-caching/"
          echo "Check the page for completeness. There should be a new version published, and two artifacts in the "Download files" section: a wheel (.whl) and a source distribution (.tar.gz)"

  release-prod:
    runs-on: ubuntu-latest
    needs: release-prod-information-PLEASE-READ
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: release-prod
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100
        with:
          role-to-assume: ${{ secrets.RELEASE_ROLE_ARN }}
          aws-region: us-west-2
          role-duration-seconds: 3600

      - name: Start prod release build
        id: start
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name "python-caching-library-PyPi-release-Test" \
            --source-version "$GITHUB_SHA" \
            --query 'build.id' --output text)

          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for prod release build
        env:
          BUILD_ID: ${{ steps.start.outputs.build-id }}
        run: |
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' --output text)

            case "$STATUS" in
              IN_PROGRESS)
                echo "Build has not finished, sleep for 30 more seconds"
                sleep 30
                ;;
              SUCCEEDED)
                echo "Build succeeded!"
                exit 0
                ;;
              *)
                echo "::error::Build finished with status $STATUS."
                exit 1
                ;;
            esac
          done
